<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .PageTitle}}{{.PageTitle}}{{else}}stream-agents{{end}}</title>
  <link rel="stylesheet" href="/assets/main.css">
</head>
<body{{block "bodyAttrs" .}}{{end}}>
  <header>
    <a href="/" class="brand">stream-agents</a>
    <nav aria-label="Main navigation"><a href="/">Sessions</a><a href="/stats">Stats</a></nav>
    <form class="header-search" action="/search" method="get" role="search">
      <input id="header-search" type="search" name="q" value="{{block "searchValue" .}}{{end}}" placeholder="Search chats…  ( / )" aria-label="Search chats">
    </form>
  </header>
  <main>
    {{block "content" .}}{{end}}
  </main>
  <script src="/assets/main.js"></script>
  <div id="notify-root" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
